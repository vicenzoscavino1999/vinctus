name: VinctusNative

options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true

configs:
  DebugDev: debug
  DebugStaging: debug
  DebugProd: debug
  ReleaseProd: release

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    SWIFT_VERSION: 5.0

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0

targets:
  VinctusNative:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - Firebase
          - VinctusNative.entitlements
        buildPhase: resources
      - path: Resources/Firebase
        type: folder
        buildPhase: resources
    settings:
      base:
        # Keep bundle id aligned with the existing Capacitor app so this can
        # eventually ship as an update under the same App Store listing.
        PRODUCT_BUNDLE_IDENTIFIER: app.vinctus.social
        # iPhone only: the UI is portrait-only and not designed for iPad (iPad would also need
        # every orientation for multitasking and its own App Store screenshots).
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_ENTITLEMENTS: Resources/VinctusNative.entitlements
        INFOPLIST_FILE: Resources/Info.plist
      configs:
        DebugDev:
          VINCTUS_ENV: dev
        DebugStaging:
          VINCTUS_ENV: staging
        DebugProd:
          VINCTUS_ENV: prod
        ReleaseProd:
          VINCTUS_ENV: prod
    # GOOGLE_REVERSED_CLIENT_ID lives here (and in the uncommitted *.local.xcconfig overrides),
    # not in `settings`, because target settings would override the xcconfig value.
    configFiles:
      DebugDev: Config/Dev.xcconfig
      DebugStaging: Config/Staging.xcconfig
      DebugProd: Config/Prod.xcconfig
      ReleaseProd: Config/Prod.xcconfig
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: GoogleSignIn
        product: GoogleSignIn

  VinctusNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: VinctusNative

  # Runs the Firebase repos against the local emulators (Auth, Firestore, Storage) and the repo's
  # firestore.rules / storage.rules. Needs `firebase emulators:exec`; see IntegrationTests/.
  VinctusNativeIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IntegrationTests
    settings:
      base:
        # CI signs this bundle (the keychain needs it), and signing needs an Info.plist.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VinctusNative

schemes:
  VinctusNative-Dev:
    build:
      targets:
        VinctusNative: all
    run:
      config: DebugDev
    test:
      config: DebugDev
      targets:
        - VinctusNativeTests

  VinctusNative-Staging:
    build:
      targets:
        VinctusNative: all
    run:
      config: DebugStaging
    test:
      config: DebugStaging
      targets:
        - VinctusNativeTests

  VinctusNative-Prod:
    build:
      targets:
        VinctusNative: all
    run:
      config: DebugProd
    test:
      config: DebugProd
      targets:
        - VinctusNativeTests

  VinctusNative-Integration:
    build:
      targets:
        VinctusNative: all
    test:
      config: DebugDev
      targets:
        - VinctusNativeIntegrationTests
