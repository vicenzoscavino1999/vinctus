name: iOS native

# Builds and tests the SwiftUI app (ios-native/VinctusNative) on a GitHub-hosted Mac,
# so Swift changes are compiled even when no local Mac is available.

on:
  push:
    paths:
      - 'ios-native/**'
      - '!ios-native/**/*.md'
      - '.github/workflows/ios-native.yml'
      # The integration job checks the app's writes against these rules.
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
  pull_request:
    paths:
      - 'ios-native/**'
      - '!ios-native/**/*.md'
      - '.github/workflows/ios-native.yml'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
  workflow_dispatch:

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ios-native
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios-native/VinctusNative
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # Drift between project.yml and the committed project. It is harmless (every setup runs
          # `xcodegen generate` first, see GUIA_APP_STORE.md); the stat shows when to refresh it.
          # Not committed back automatically: bot commits leave a PR's checks waiting for approval.
          git diff --stat -- VinctusNative.xcodeproj

      - uses: actions/cache@v4
        with:
          path: ios-native/VinctusNative/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios-native/VinctusNative/VinctusNative.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Same configuration as the App Store archive (ReleaseProd), so DEBUG-only code is excluded.
      - name: Build (ReleaseProd)
        run: |
          xcodebuild build \
            -project VinctusNative.xcodeproj \
            -scheme VinctusNative-Prod \
            -configuration ReleaseProd \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Unit tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))
          ')
          xcodebuild test \
            -project VinctusNative.xcodeproj \
            -scheme VinctusNative-Dev \
            -destination "id=$DEVICE_ID" \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

  # Runs the app's Firebase repos (ios-native/VinctusNative/IntegrationTests) against the Auth,
  # Firestore and Storage emulators loaded with this repo's firestore.rules and storage.rules, so
  # a write the rules reject fails here instead of in production.
  # Unlike the build job, the app is signed ("Sign to Run Locally", no team): Firebase Auth keeps
  # the signed-in user in the keychain, and an unsigned app gets errSecMissingEntitlement (-34018).
  integration:
    name: ios-native-integration
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools@15

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-native/VinctusNative
        run: xcodegen generate

      - uses: actions/cache@v4
        with:
          path: ios-native/VinctusNative/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios-native/VinctusNative/VinctusNative.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Integration tests (Firebase emulators)
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))
          ')
          firebase emulators:exec --project vinctus-dev --only auth,firestore,storage \
            "xcodebuild test \
              -project ios-native/VinctusNative/VinctusNative.xcodeproj \
              -scheme VinctusNative-Integration \
              -destination id=$DEVICE_ID \
              -clonedSourcePackagesDirPath ios-native/VinctusNative/.spm \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 180 \
              -resultBundlePath $RUNNER_TEMP/integration.xcresult \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY=- \
              DEVELOPMENT_TEAM= \
              PROVISIONING_PROFILE_SPECIFIER= \
              -quiet"

      # `-quiet` hides why a test failed; the result bundle has it.
      - name: Show integration test failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/integration.xcresult" --compact \
            | python3 -c '
          import json, sys
          summary = json.load(sys.stdin)
          print("passed:", summary.get("passedTests"), "failed:", summary.get("failedTests"))
          for failure in summary.get("testFailures", []):
              print("\n" + failure.get("testName", "?") + "\n  " + failure.get("failureText", "").replace("\n", "\n  "))
          '

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-xcresult
          path: ${{ runner.temp }}/integration.xcresult
