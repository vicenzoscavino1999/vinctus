name: iOS native

# Builds and tests the SwiftUI app (ios-native/VinctusNative) on a GitHub-hosted Mac,
# so Swift changes are compiled even when no local Mac is available.

on:
  push:
    paths:
      - 'ios-native/**'
      - '!ios-native/**/*.md'
      - '.github/workflows/ios-native.yml'
  pull_request:
    paths:
      - 'ios-native/**'
      - '!ios-native/**/*.md'
      - '.github/workflows/ios-native.yml'
  workflow_dispatch:

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Lets the last step commit the regenerated Xcode project back to the branch.
  contents: write

jobs:
  build:
    name: ios-native
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios-native/VinctusNative
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # Drift between project.yml and the committed project (committed back by the last step).
          git diff --stat -- VinctusNative.xcodeproj

      - uses: actions/cache@v4
        with:
          path: ios-native/VinctusNative/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios-native/VinctusNative/VinctusNative.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Same configuration as the App Store archive (ReleaseProd), so DEBUG-only code is excluded.
      - name: Build (ReleaseProd)
        run: |
          xcodebuild build \
            -project VinctusNative.xcodeproj \
            -scheme VinctusNative-Prod \
            -configuration ReleaseProd \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Unit tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))
          ')
          xcodebuild test \
            -project VinctusNative.xcodeproj \
            -scheme VinctusNative-Dev \
            -destination "id=$DEVICE_ID" \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # Without a Mac, nobody can run XcodeGen locally, so once the app builds and its tests pass the
      # regenerated project is committed back to the branch that was pushed. Pushes made with
      # GITHUB_TOKEN don't start new workflow runs, so this can't loop.
      - name: Commit regenerated Xcode project
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- VinctusNative.xcodeproj/project.pbxproj; then
            echo "Xcode project is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VinctusNative.xcodeproj/project.pbxproj
          git commit -m "Regenerate Xcode project from project.yml"
          # If the branch moved on meanwhile, the next run regenerates it again.
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::Branch moved on; the next run will commit the project."
